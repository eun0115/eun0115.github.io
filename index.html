<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ec">
  <meta name="description" content="eun0115's little corner of pictures.">
  <title>eun0115 | Home</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-wh.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f9ff;
      --paper-strong: #eaf3ff;
      --ink: #123d5f;
      --ink-soft: #426b8a;
      --blue: #bfe0ff;
      --blue-deep: #7db8e6;
      --blue-accent: #4c8ecb;
      --line: rgba(18, 61, 95, .18);
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    @view-transition { navigation: auto; }

    ::view-transition-old(root) {
      animation: page-transition-out .16s ease both;
    }

    ::view-transition-new(root) {
      animation: page-transition-in .38s cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes page-transition-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes page-transition-out {
      to { opacity: 0; }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; }
    a { color: inherit; }

    .wrap {
      width: min(1760px, calc(100% - clamp(40px, 7vw, 128px)));
      margin-inline: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 249, 255, .72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background .2s ease, box-shadow .2s ease;
    }

    .topbar .wrap {
      width: min(1760px, calc(100vw - clamp(40px, 7vw, 128px)));
      position: relative;
      left: calc((100vw - 100%) / 2);
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      transition: min-height .2s ease;
    }

    body.scrolled .topbar {
      box-shadow: 0 8px 22px rgba(18, 61, 95, .06);
    }

    body.scrolled .topbar .wrap {
      min-height: 36px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 0;
      transition: transform .18s ease, opacity .18s ease;
      transform-origin: center;
    }

    .wordmark:hover { opacity: .88; }
    .wordmark:active,
    .wordmark:focus-visible {
      transform: scale(.94);
    }

    .wordmark img {
      display: block;
      height: 30px;
      width: auto;
    }

    nav { display: flex; gap: clamp(14px, 2.4vw, 32px); }
    nav a {
      display: inline-block;
      font-family: "DM Sans", sans-serif;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
      transition: transform .18s ease, opacity .18s ease, font-size .2s ease;
      transform-origin: center;
    }

    nav a:hover, .email:hover { text-decoration-thickness: 2px; text-underline-offset: 4px; }
    nav a:active,
    nav a:focus-visible {
      transform: scale(.96);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr);
      gap: clamp(28px, 5vw, 110px);
      align-items: center;
      padding-block: clamp(48px, 6vw, 125px);
    }

    .hero > div:first-child,
    .portrait,
    .project { animation: content-enter .45s both; }
    .hero > div:first-child { min-width: 0; }
    .portrait { animation-delay: .06s; }
    .project:nth-child(2) { animation-delay: .18s; }
    .project:nth-child(3) { animation-delay: .24s; }
    .project:nth-child(4) { animation-delay: .3s; }

    @keyframes content-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before { width: 22px; height: 2px; background: var(--blue-accent); content: ""; }

    h1, h2, p { margin-top: 0; }
    h1 {
      max-width: 880px;
      margin-bottom: 16px;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(48px, calc(5.5vw + 16px), 128px);
      font-weight: 500;
      line-height: .9;
    }

    h1 em { color: var(--blue-accent); font-weight: 500; }
    .intro {
      max-width: 680px;
      margin: 0 0 30px;
      color: var(--ink-soft);
      font-size: clamp(16px, calc(.7vw + 8px), 24px);
      line-height: 1.65;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 13px 17px;
      background: var(--ink);
      color: var(--paper);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }

    .contact-link:hover { background: var(--blue-accent); transform: translateY(-2px); }
    .contact-link span { font-size: 17px; line-height: 1; }

    .portrait {
      position: relative;
      width: min(100%, 760px);
      aspect-ratio: 4 / 3;
      margin-inline: auto;
      background: var(--blue);
      isolation: isolate;
    }

    .portrait::before {
      position: absolute;
      z-index: -1;
      inset: 18px -18px -18px 18px;
      background: var(--blue-deep);
      content: "";
    }

    .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .caption { position: absolute; right: 12px; bottom: 12px; padding: 8px 11px; background: var(--paper); font-size: 11px; }

    .work { padding-block: 34px 74px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); }
    .section-heading h2 { margin-bottom: 15px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .section-heading p { margin-bottom: 15px; color: var(--ink-soft); font-size: 12px; }

    .projects { display: grid; grid-template-columns: repeat(3, 1fr); }
    .project { padding: 23px 24px 6px 0; }
    .project + .project { padding-left: 24px; border-left: 1px solid var(--line); }
    .project-number { display: block; margin-bottom: 22px; color: var(--blue-accent); font-size: 11px; font-weight: 700; }
    .project h3 { margin: 0 0 8px; font-family: "Fraunces", Georgia, serif; font-size: 23px; font-weight: 500; }
    .project p { max-width: 290px; margin-bottom: 12px; color: var(--ink-soft); font-size: 13px; line-height: 1.65; }

    footer { display: flex; justify-content: space-between; gap: 18px; padding-block: 21px; border-top: 1px solid var(--line); font-size: 12px; }
    footer p { margin: 0; }
    .email { text-underline-offset: 3px; }

    .site-footer {
      display: none;
      width: 100%;
      margin-top: clamp(10px, 1vw, 18px);
      background: var(--ink);
      color: var(--paper);
      padding: clamp(6px, .6vw, 12px) 0;
    }

    .site-footer-inner {
      width: min(1760px, calc(100% - clamp(40px, 7vw, 128px)));
      margin: 0 auto;
    }

    .footer-copy {
      margin: 0;
      color: inherit;
      font-size: clamp(11px, .8vw, 15px);
    }

    .footer-logo {
      display: block;
      width: clamp(36px, 2.9vw, 56px);
      height: clamp(20px, 1.5vw, 30px);
      object-fit: contain;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(14px, 2vw, 32px);
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: clamp(6px, .65vw, 12px);
    }

    .footer-socials {
      display: flex;
      align-items: center;
      gap: clamp(8px, .75vw, 14px);
    }

    .footer-socials a {
      display: inline-flex;
      width: clamp(14px, 1vw, 20px);
      height: clamp(14px, 1vw, 20px);
      align-items: center;
      justify-content: center;
      color: var(--paper);
      transition: color .18s ease, transform .18s ease;
    }

    .footer-socials a:hover,
    .footer-socials a:focus-visible {
      color: var(--blue-accent);
      transform: translateY(-2px);
    }

    .footer-socials svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    @media (min-width: 701px) {
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: clamp(16px, 2vh, 24px);
      }

      .topbar,
      .site-footer {
        flex-shrink: 0;
      }

      main#home {
        flex: 1;
      }
    }

    @media (min-width: 701px) and (max-height: 760px) {
      body { padding-bottom: 36px; }

      .hero {
        padding-block: clamp(18px, 3vh, 30px);
      }

      .portrait {
        width: min(100%, 760px, 55vh);
      }
    }

    @media (min-width: 701px) and (max-height: 540px) {
      .hero {
        gap: 24px;
        padding-block: 12px;
      }

      .eyebrow { margin-bottom: 12px; }
      h1 {
        margin-bottom: 10px;
        font-size: clamp(42px, 6vh, 58px);
      }

      .intro {
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.4;
      }

      .portrait {
        width: min(100%, 55vh);
      }
    }

    @media (max-width: 700px) {
      .wrap { width: min(100% - 20px, 520px); }
      .topbar {
        min-height: 44px;
        height: 44px;
      }
      .topbar .wrap {
        width: min(calc(100vw - 20px), 520px);
        min-height: 44px;
        height: 44px;
        gap: 10px;
      }
      body.scrolled .topbar {
        min-height: 28px;
        height: 28px;
      }
      body.scrolled .topbar .wrap {
        min-height: 28px;
        height: 28px;
      }
      .wordmark img { height: 16px; }
      nav { gap: 8px; }
      nav a { font-size: 12px; }
      body.scrolled nav a { font-size: 10px; }
      .hero { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 64px 72px; }
      .portrait { width: calc(100% - 14px); min-width: 0; min-height: 310px; }
      .portrait img { min-height: 310px; }
      .work { padding-bottom: 54px; }
      .projects { grid-template-columns: 1fr; }
      .project, .project + .project { padding: 20px 0; border-left: 0; }
      .project + .project { border-top: 1px solid var(--line); }
      .project-number { margin-bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .hero > div:first-child,
      .portrait,
      .project { animation: none; }
      ::view-transition-old(root),
      ::view-transition-new(root) { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="wordmark" href="#home" aria-label="Home">
        <img src="assets/logo.svg" alt="Logo" />
      </a>
      <nav aria-label="Main navigation">
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">About</a>
      </nav>
    </div>
  </header>

  <main id="home" class="wrap">
    <section class="hero" id="about" aria-labelledby="intro-title">
      <div>
        <p class="eyebrow">A plane spotter's journal</p>
        <h1 id="intro-title">Every arrival has <em>a story.</em></h1>
        <p class="intro">What started as a curiosity about aircraft grew into a passion for planespotting and photography. Here, I document the aircraft I've encountered, the places I've visited, and the moments I've captured along the way.</p>
      </div>
      <div class="portrait">
        <img src="assets/ceb.jpg">
      </div>
    </section>

  </main>

  <footer class="site-footer" aria-label="Footer">
    <div class="site-footer-inner">
      <div class="footer-content">
        <div class="footer-brand">
          <p class="footer-copy">&copy; 2026</p>
          <img class="footer-logo" src="assets/logo-wh.svg" alt="eun0115">
        </div>
        <nav class="footer-socials" aria-label="Social links">
          <a href="https://discord.com/users/742358534989283358" aria-label="Discord" target="_blank" rel="noopener noreferrer">

          </a>
          <a href="https://www.instagram.com/eun0115_" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7Zm5 3.1a4.7 4.7 0 1 1 0 9.4 4.7 4.7 0 0 1 0-9.4Zm0 2.2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5-3.7a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/></svg>

          </a>
        </nav>
      </div>
    </div>
  </footer>

  <script>
    const syncNavState = () => {
      const isCompact = document.body.classList.contains('scrolled');
      const collapseDistance = window.innerWidth <= 700 ? 16 : 40;
      const canCompact = document.documentElement.scrollHeight - window.innerHeight > collapseDistance + 8;
      const shouldCompact = isCompact
        ? window.scrollY >= 8
        : window.scrollY > 40 && canCompact;

      if (shouldCompact !== isCompact) {
        document.body.classList.toggle('scrolled', shouldCompact);
      }
    };

    let ticking = false;

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          syncNavState();
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    syncNavState();
  </script>
</body>
</html>
