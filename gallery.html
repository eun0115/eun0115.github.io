<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aircraft, approaches, and aviation moments from a plane spotter's point of view.">
  <title>eun0115 | Spotting Gallery</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-wh.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f9ff;
      --paper-strong: #eaf3ff;
      --ink: #123d5f;
      --ink-soft: #426b8a;
      --blue: #bfe0ff;
      --blue-deep: #7db8e6;
      --blue-accent: #4c8ecb;
      --line: rgba(18, 61, 95, .18);
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    @view-transition { navigation: auto; }

    ::view-transition-old(root) {
      animation: page-transition-out .16s ease both;
    }

    ::view-transition-new(root) {
      animation: page-transition-in .38s cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes page-transition-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes page-transition-out {
      to { opacity: 0; }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: linear-gradient(180deg, #f4f9ff 0%, #edf6ff 100%); }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .wrap { width: min(1200px, calc(100% - 52px)); margin-inline: auto; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 249, 255, .72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background .2s ease, box-shadow .2s ease;
    }

    .topbar .wrap {
      width: min(1120px, calc(100% - 48px));
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      transition: min-height .2s ease;
    }

    body.scrolled .topbar {
      box-shadow: 0 8px 22px rgba(18, 61, 95, .06);
    }

    body.scrolled .topbar .wrap {
      min-height: 36px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      transition: transform .18s ease, opacity .18s ease;
      transform-origin: center;
    }

    .wordmark img {
      display: block;
      height: 30px;
      width: auto;
    }

    nav { display: flex; gap: clamp(14px, 2.4vw, 32px); }
    nav a {
      display: inline-block;
      font-family: "DM Sans", sans-serif;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
      transition: opacity .2s ease, transform .18s ease, font-size .2s ease;
      transform-origin: center;
    }
    nav a:hover { opacity: .8; }
    nav a:active,
    nav a:focus-visible {
      transform: scale(.96);
    }

    main { padding-block: clamp(10px, 1.5vw, 22px) 80px; }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin-bottom: 30px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-accent);
    }

    .intro-copy {
      max-width: 700px;
    }

    .intro-meta {
      color: var(--ink-soft);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(36px, 4.8vw, 64px);
      font-weight: 500;
      line-height: 1.04;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .35);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(76, 142, 203, .35);
      box-shadow: 0 18px 32px rgba(18, 61, 95, .09);
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      object-fit: cover;
      display: block;
      animation: content-enter .45s both;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      padding: 12px 14px 14px;
      animation: content-enter .45s both;
    }

    .card:nth-child(2) img,
    .card:nth-child(2) .card-body { animation-delay: .06s; }
    .card:nth-child(3) img,
    .card:nth-child(3) .card-body { animation-delay: .12s; }
    .card:nth-child(4) img,
    .card:nth-child(4) .card-body { animation-delay: .18s; }
    .card:nth-child(5) img,
    .card:nth-child(5) .card-body { animation-delay: .24s; }
    .card:nth-child(6) img,
    .card:nth-child(6) .card-body { animation-delay: .3s; }

    @keyframes content-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-tag {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-accent);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 0;
    }

    .card h2 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.08;
      flex: 0 1 auto;
      cursor: pointer;
    }

    .card h2 + p {
      margin-top: 0;
    }

    .card-meta {
      display: none;
    }

    .card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.7;
    }

    .info-button {
      display: none;
    }

    .project-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(18, 61, 95, .38);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .project-modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-panel {
      position: relative;
      width: min(420px, 100%);
      max-height: min(70vh, 560px);
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: rgba(244, 249, 255, .96);
      border: 1px solid var(--line);
      box-shadow: 0 28px 64px rgba(18, 61, 95, .18);
    }

    .modal-panel::-webkit-scrollbar {
      display: none;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, .7);
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-copy {
      padding: 20px 22px 22px;
    }

    .modal-tag {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-accent);
    }

    .modal-copy h3 {
      margin: 0 0 10px;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(26px, 3vw, 32px);
      font-weight: 500;
      line-height: 1.08;
    }

    .modal-copy p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.7;
    }

    .modal-meta {
      margin-top: 16px;
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding-block: 21px;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .wrap { width: min(100% - 20px, 520px); }
      .topbar {
        min-height: 44px;
        height: 44px;
      }
      .topbar .wrap {
        width: min(100% - 20px, 520px);
        min-height: 44px;
        height: 44px;
        gap: 10px;
      }
      body.scrolled .topbar {
        min-height: 28px;
        height: 28px;
      }
      body.scrolled .topbar .wrap {
        min-height: 28px;
        height: 28px;
      }
      .wordmark img { height: 16px; }
      nav { gap: 8px; }
      nav a { font-size: 12px; }
      body.scrolled nav a { font-size: 10px; }
      main { padding-top: clamp(10px, 3.5vw, 18px); }
      .intro {
        display: block;
        margin-bottom: 24px;
      }
      .intro-meta {
        display: block;
        margin-top: 12px;
        white-space: normal;
      }
      .gallery-grid { grid-template-columns: 1fr; }
      .card img { aspect-ratio: 16 / 9; }
      .modal-panel { max-height: 88vh; }
      .modal-copy { padding: 22px 20px 26px; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card img,
      .card-body { animation: none; }
      ::view-transition-old(root),
      ::view-transition-new(root) { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="wordmark" href="index.html" aria-label="Home">
        <img src="assets/logo.svg" alt="Logo" />
      </a>
      <nav aria-label="Main navigation">
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">About</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="gallery-grid" aria-label="Planespotting gallery">
      <article class="card" data-tag="Approach" data-title="Final Approach" data-description="An airliner descends toward the runway, framed by the landscape beyond the airport perimeter." data-meta="Arrival · Aviation">
        <img src="https://images.unsplash.com/photo-1556388158-158ea5ccacbd?auto=format&fit=crop&w=900&q=85" alt="Airliner approaching a runway with mountains in the distance">
        <div class="card-body">
          <span class="card-tag">Approach</span>
          <div class="card-header">
            <h2 tabindex="0" aria-label="More information about Final Approach">Final Approach</h2>
          </div>
        </div>
      </article>

      <article class="card" data-tag="At the airport" data-title="On Stand" data-description="A quiet pause at the gate, with the aircraft framed by the terminal and the last light of the day." data-meta="At the airport · Aviation">
        <img src="https://images.unsplash.com/photo-1542296332-2e4473faf563?auto=format&fit=crop&w=900&q=85" alt="Passenger aircraft parked at a terminal at sunset">
        <div class="card-body">
          <span class="card-tag">At the airport</span>
          <div class="card-header">
            <h2 tabindex="0" aria-label="More information about On Stand">On Stand</h2>
          </div>
        </div>
      </article>

      <article class="card" data-tag="Golden hour" data-title="Last Light" data-description="Warm evening light catches an aircraft on the apron, turning an ordinary wait into a moment worth remembering." data-meta="Golden hour · Aviation">
        <img src="https://images.unsplash.com/photo-1474302770737-173ee21bab63?auto=format&fit=crop&w=900&q=85" alt="Private jet on the runway in golden evening light">
        <div class="card-body">
          <span class="card-tag">Golden hour</span>
          <div class="card-header">
            <h2 tabindex="0" aria-label="More information about Last Light">Last Light</h2>
          </div>
        </div>
      </article>

      <article class="card" data-tag="In flight" data-title="Above the Clouds" data-description="A view from the cabin: wing, cloud tops, and the changing color of the sky at altitude." data-meta="In flight · Aviation">
        <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=900&q=85" alt="Airplane wing above clouds at sunset">
        <div class="card-body">
          <span class="card-tag">In flight</span>
          <div class="card-header">
            <h2 tabindex="0" aria-label="More information about Above the Clouds">Above the Clouds</h2>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div class="project-modal" id="projectModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Close project details">×</button>
      <div class="modal-copy">
        <span class="modal-tag" id="modalTag">Brand</span>
        <h3 id="modalTitle">Project title</h3>
        <p id="modalDescription">Project description</p>
        <div class="modal-meta" id="modalMeta">Category · year</div>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('projectModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalTag = document.getElementById('modalTag');
    const modalDescription = document.getElementById('modalDescription');
    const modalMeta = document.getElementById('modalMeta');
    const closeButton = document.querySelector('.modal-close');

    const updateScrollState = () => {
      const isCompact = document.body.classList.contains('scrolled');
      const collapseDistance = window.innerWidth <= 700 ? 16 : 40;
      const canCompact = document.documentElement.scrollHeight - window.innerHeight > collapseDistance + 8;
      const shouldCompact = isCompact
        ? window.scrollY >= 8
        : window.scrollY > 40 && canCompact;

      if (shouldCompact !== isCompact) {
        document.body.classList.toggle('scrolled', shouldCompact);
      }
    };

    let scrollTick = null;
    const requestScrollUpdate = () => {
      if (scrollTick) return;
      scrollTick = requestAnimationFrame(() => {
        scrollTick = null;
        updateScrollState();
      });
    };

    window.addEventListener('scroll', requestScrollUpdate, { passive: true });
    updateScrollState();

    const openProjectModal = (card) => {
      const tag = card.dataset.tag || 'Project';
      const title = card.dataset.title || 'Untitled project';
      const description = card.dataset.description || 'More details coming soon.';
      const meta = card.dataset.meta || 'Project';

      modalTag.textContent = tag;
      modalTitle.textContent = title;
      modalDescription.textContent = description;
      modalMeta.textContent = meta;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    };

    const closeProjectModal = () => {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    };

    document.querySelectorAll('.card h2').forEach((title) => {
      const trigger = (event) => {
        event.preventDefault();
        const card = title.closest('.card');
        if (card) openProjectModal(card);
      };

      title.addEventListener('click', trigger);
      title.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          trigger(event);
        }
      });
    });

    closeButton.addEventListener('click', closeProjectModal);

    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeProjectModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('open')) {
        closeProjectModal();
      }
    });
  </script>
</body>
</html>
