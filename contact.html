<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get in touch. Contact me about projects, collaborations, or questions.">
  <title>eun0115 | Contact</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-wh.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f9ff;
      --ink: #123d5f;
      --ink-soft: #426b8a;
      --blue-accent: #4c8ecb;
      --line: rgba(18, 61, 95, .18);
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: page-out .16s ease both; }
    ::view-transition-new(root) { animation: page-in .38s cubic-bezier(.2, .7, .2, 1) both; }

    @keyframes page-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes page-out {
      to { opacity: 0; }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; }
    a { color: inherit; }

    .wrap { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 249, 255, .72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background .2s ease, box-shadow .2s ease;
    }

    .topbar .wrap {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      transition: min-height .2s ease;
    }

    body.scrolled .topbar { box-shadow: 0 8px 22px rgba(18, 61, 95, .06); }
    body.scrolled .topbar .wrap { min-height: 36px; }

    .wordmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      text-decoration: none;
    }

    .wordmark img { display: block; width: auto; height: 30px; }
    nav { display: flex; gap: clamp(14px, 2.4vw, 32px); }

    nav a {
      display: inline-block;
      font-family: "DM Sans", sans-serif;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
      transition: opacity .2s ease, transform .18s ease;
    }

    nav a:hover { opacity: .8; }
    nav a:active, nav a:focus-visible { transform: scale(.96); }

    main {
      min-height: calc(100vh - 76px);
      display: grid;
      align-content: center;
      padding-block: 80px;
      animation: page-content-in .45s both;
    }

    @keyframes page-content-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .contact-content { max-width: 760px; }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--blue-accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 20px;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(48px, 7.4vw, 88px);
      font-weight: 500;
      line-height: .98;
    }

    .contact-copy {
      max-width: 480px;
      margin: 0 0 30px;
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.75;
    }

    .email-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 18px;
      font-weight: 500;
      text-decoration: none;
      transition: color .2s ease, border-color .2s ease;
    }

    .email-link:hover { color: var(--blue-accent); border-color: var(--blue-accent); }
    .email-link span { font-size: 17px; }

    @media (max-width: 700px) {
      .wrap { width: min(100% - 20px, 520px); }
      .topbar { min-height: 44px; height: 44px; }
      .topbar .wrap { min-height: 44px; height: 44px; gap: 10px; }
      body.scrolled .topbar { min-height: 28px; height: 28px; }
      body.scrolled .topbar .wrap { min-height: 28px; height: 28px; }
      .wordmark img { height: 16px; }
      nav { gap: 8px; }
      nav a { font-size: 12px; }
      body.scrolled nav a { font-size: 10px; }
      main { min-height: calc(100vh - 44px); padding-block: 56px; }
      h1 { font-size: clamp(42px, 12vw, 64px); }
      .email-link { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      main, ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="wordmark" href="index.html" aria-label="Home">
        <img src="assets/logo.svg" alt="Logo">
      </a>
      <nav aria-label="Main navigation">
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" aria-current="page">About</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="contact-content" aria-labelledby="contact-title">
      <h1 id="contact-title">Have a question?</h1>
      <p class="contact-copy">For project enquiries, collaborations, or questions, reach out below.</p>
      <a class="email-link" href="mailto:gpestacio5@gail.com">Get in touch <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <script>
    const syncNavState = () => {
      const isCompact = document.body.classList.contains('scrolled');
      const collapseDistance = window.innerWidth <= 700 ? 16 : 40;
      const canCompact = document.documentElement.scrollHeight - window.innerHeight > collapseDistance + 8;
      const shouldCompact = isCompact
        ? window.scrollY >= 8
        : window.scrollY > 40 && canCompact;

      if (shouldCompact !== isCompact) {
        document.body.classList.toggle('scrolled', shouldCompact);
      }
    };

    let ticking = false;

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          syncNavState();
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    syncNavState();
  </script>
</body>
</html>
